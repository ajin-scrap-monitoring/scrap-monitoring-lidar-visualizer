name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.4"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: tools/requirements-ci.txt

      - name: Install validation dependencies
        run: |
          uv venv .venv
          uv pip sync --python .venv/bin/python --require-hashes tools/requirements-ci.txt

      - name: Validate Markdown
        run: .venv/bin/rumdl check --no-config --no-cache --disable MD013 .

      - name: Validate repository boundaries and contracts
        run: .venv/bin/python tools/check_repository.py

      - name: Check Python formatting
        run: .venv/bin/ruff format --check tools

      - name: Lint Python
        run: .venv/bin/ruff check --select E4,E7,E9,F,I,B,UP tools

      - name: Check Python types
        run: .venv/bin/mypy --strict --python-version 3.14 tools/check_repository.py tools/check_release.py

      - name: Test repository and release policies
        run: .venv/bin/python -m unittest discover -s tools/tests -v

      - name: Compile validation tools
        run: .venv/bin/python -m compileall -q tools

      - name: Validate release target
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: .venv/bin/python tools/check_release.py --tag "$RELEASE_TAG" --revision "$RELEASE_COMMIT"
