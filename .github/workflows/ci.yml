name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.7"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Validate Markdown
        run: uv run --frozen rumdl check --no-config --no-cache --disable MD013 .

      - name: Validate repository boundaries and contracts
        run: uv run --frozen python tools/check_repository.py

      - name: Check Python formatting
        run: uv run --frozen ruff format --check src tests tools

      - name: Lint Python
        run: uv run --frozen ruff check src tests tools

      - name: Check Python types
        run: uv run --frozen mypy

      - name: Run tests
        run: uv run --frozen pytest

      - name: Compile validation tools
        run: uv run --frozen python -m compileall -q src tests tools

      - name: Validate headless container
        run: scripts/check-headless-container.sh

      - name: Validate release target
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: uv run --frozen python tools/check_release.py --tag "$RELEASE_TAG" --revision "$RELEASE_COMMIT"
